<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Mutual Fund RAG Assistant</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Minimal Stylesheet -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat-layout">
    
    <!-- Minimal Header -->
    <header class="chat-header">
      <div class="header-title">
        <i class="fa-solid fa-chart-pie"></i>
        <span>SBI Mutual Fund Assistant</span>
      </div>
      <button id="clearChatBtn" class="clear-btn" title="New Chat">
        <i class="fa-solid fa-pen-to-square"></i>
      </button>
    </header>

    <!-- Chat Messages Stream -->
    <main class="chat-stream" id="messagesStream">
      <!-- Initial Welcome Message & Suggestions -->
      <div class="welcome-container" id="welcomeHero">
        <div class="welcome-header">
          <div class="welcome-logo">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <h2>How can I assist you today?</h2>
          <p>I provide factual answers based strictly on official SBI MF and SEBI documentation.</p>
        </div>
        
        <div class="suggestions-grid">
          <button class="suggestion-card" data-query="What is the expense ratio of SBI Blue Chip Fund?">
            <div class="suggestion-icon"><i class="fa-solid fa-percent"></i></div>
            <div class="suggestion-text">
              <span class="suggestion-title">Expense Ratios</span>
              <span class="suggestion-desc">Check the TER for SBI Blue Chip Fund</span>
            </div>
          </button>
          
          <button class="suggestion-card" data-query="What is the lock-in period for ELSS mutual funds?">
            <div class="suggestion-icon"><i class="fa-solid fa-lock"></i></div>
            <div class="suggestion-text">
              <span class="suggestion-title">Tax Saving (ELSS)</span>
              <span class="suggestion-desc">Understand lock-in periods and 80C</span>
            </div>
          </button>

          <button class="suggestion-card" data-query="How do I download my capital gains statement?">
            <div class="suggestion-icon"><i class="fa-regular fa-file-pdf"></i></div>
            <div class="suggestion-text">
              <span class="suggestion-title">Account Services</span>
              <span class="suggestion-desc">Get your capital gains statement</span>
            </div>
          </button>

          <button class="suggestion-card" data-query="Can I pause or stop my SIP at any time?">
            <div class="suggestion-icon"><i class="fa-solid fa-stopwatch"></i></div>
            <div class="suggestion-text">
              <span class="suggestion-title">SIP Management</span>
              <span class="suggestion-desc">Learn about stopping or pausing a SIP</span>
            </div>
          </button>
        </div>
      </div>
    </main>

    <!-- Chat Input Area -->
    <footer class="chat-footer">
      <form class="chat-form" id="chatForm">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            rows="1"
            placeholder="Ask a question about SBI Mutual Funds..."
            autocomplete="off"
            required
          ></textarea>
          <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </div>
      </form>
      <div class="disclaimer">
        Responses are generated by an AI assistant using official sources. Mutual fund investments are subject to market risks.
      </div>
    </footer>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
